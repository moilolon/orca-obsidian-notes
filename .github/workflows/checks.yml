name: Run the checks

# The checks a pull request must pass (Dependabot's too): the types, the tests and the panel
# rendered once. They run on the Orca CLI of the latest release, the one users update to: its
# Linux package carries the CLI, the plugin runtime and the typings (the server build has no
# typings), checked against the sha256 digest GitHub keeps for the asset.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Node Orca runs plugin workers on
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the Orca CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          tag=$(gh api repos/stablyai/orca/releases/latest --jq .tag_name)
          asset="orca-ide_${tag#v}_amd64.deb"
          digest=$(gh api "repos/stablyai/orca/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest")
          gh release download "$tag" --repo stablyai/orca --pattern "$asset"
          echo "${digest#sha256:}  $asset" | sha256sum --check -
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "./$asset"
          mkdir bin && ln -s /opt/Orca/resources/bin/orca-ide bin/orca
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          bin/orca --version

      - run: orca plugin types .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
